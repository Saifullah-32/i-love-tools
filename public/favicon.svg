<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a2387" />
      <stop offset="50%" stop-color="#e94057" />
      <stop offset="100%" stop-color="#f27121" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1" />
    </filter>
  </defs>
  
  <!-- Rounded White Background -->
  <rect width="100" height="100" rx="22" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Gradient Lightning Bolt -->
  <polygon points="56,18 24,56 50,56 44,82 76,44 50,44" fill="url(#brand-gradient)" />
</svg>
